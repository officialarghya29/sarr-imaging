# PIPELINE SMOKE TEST (not a research experiment).
#
# Trains the stock YOLO11n baseline for 2 epochs at 128px on synthetic data with a
# rank-4 LoRA adapter, to verify that the adapter is injected into the model that is
# actually trained -- and not into a facade that Ultralytics then throws away.
#
# That distinction is the whole reason this config exists. `YOLO.train()` rebuilds the
# model from its config inside the trainer, so an adapter injected by the runner never
# reaches the optimiser; the first real LoRA arm was recorded in the ledger as
# parameter-efficient and its saved checkpoint contained no `lora_` tensor at all. This
# config is what `tests/test_peft.py::test_a_lora_arm_end_to_end_trains_adapters` trains
# to check, on the actual checkpoint, that the adapter survived.
#
# It is named with a leading underscore so `saryolo.training.config.list_experiments`
# and the experiment matrix ignore it, exactly like the other `_smoke_*.yaml` arms.
#
#   python -m saryolo synth-data --out datasets/processed/synthetic_smoke
#   python -m saryolo train --exp configs/exp/_smoke_lora.yaml
#
# Any number produced by this config is meaningless as a research result.
experiment:
  id: SMOKE-LORA
  name: pipeline smoke test (LoRA r=4)
  description: 2 epochs at 128px on synthetic data with a rank-4 adapter; proves the injection path.
model: ../models/yolo11n_baseline_n.yaml
dataset: ../datasets/synthetic_smoke.yaml
train:
  epochs: 2
  imgsz: 128
  batch: 4
  seed: 0
  workers: 0
  patience: 50
  plots: false
  cos_lr: true
peft:
  method: lora
  rank: 4
  alpha: 8.0
notes: Pipeline verification only; synthetic data; not reportable.

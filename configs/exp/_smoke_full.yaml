# PIPELINE SMOKE TEST (not a research experiment).
#
# Trains the FULL SAR-YOLO (all four modules + P2 head + SAR-aware loss) for 2
# epochs at 128px on synthetic data. This verifies that the custom layers build,
# the P2 detection level is wired, the SAR-aware criterion contributes its fourth
# loss term, and the checkpoint can be written and reloaded.
#
#   python -m saryolo synth-data --out datasets/processed/synthetic_smoke
#   python -m saryolo train --exp configs/exp/_smoke_full.yaml
#
# Any number produced by this config is meaningless as a research result.
experiment:
  id: SMOKE-002
  name: pipeline smoke test (full SAR-YOLO)
  description: 2 epochs at 128px on synthetic data, CPU-only, exercising every SAR module and the SAR loss.
model: ../models/yolo11n_full_n.yaml
dataset: ../datasets/synthetic_smoke.yaml
train:
  epochs: 2
  imgsz: 128
  batch: 4
  seed: 0
  workers: 0
  patience: 50
  plots: false
  cos_lr: true
notes: Pipeline verification only; synthetic data; not reportable.

# MULTI-SEED repeat of REAL-004 (SARVO prototype: ratio-space CFAR front end), seed 1.
#
# The arm whose claim is under test. Paired with the MSEED-B* baselines at the same
# seeds, so the mAP50:95 difference between the prototype and the baseline can be read
# against the seed spread rather than against a single draw.
experiment:
  id: MSEED-C1
  name: seed spread (CFAR front end, seed 1)
  description: Multi-seed repeat of REAL-004 at seed 1; a seed-spread measurement.
model: ../models/yolo11n_cfar_n.yaml
dataset: ../datasets/hrsid_real.yaml
train:
  epochs: 40
  imgsz: 320
  batch: 4
  seed: 1
  optimizer: auto
  cos_lr: true
  patience: 15
  workers: 4
  deterministic: true
notes: Seed spread only. Same arm, dataset and schedule as REAL-004 (seed 0).

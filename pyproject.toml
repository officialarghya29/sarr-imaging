[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saryolo"
version = "0.1.0"
description = "SAR-YOLO: speckle-aware feature representation for robust SAR object detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arghya Bose", email = "officialarghya29@gmail.com" }]
keywords = ["SAR", "object detection", "YOLO", "speckle", "remote sensing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.2.0",
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "PyYAML>=6.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]
track = ["tensorboard>=2.15.0"]
analysis = ["thop>=0.1.1", "seaborn>=0.13.0", "pycocotools>=2.0.7"]

[project.scripts]
saryolo = "saryolo.cli:main"

[tool.setuptools.packages.find]
include = ["saryolo*"]

# NOTE: no package-data entry for YAML. The model YAMLs (`configs/models/`) and
# data configs (`configs/datasets/`) live at the repository root and are consumed
# by the CLI relative to the working directory, not bundled into the wheel -- the
# previous `saryolo = ["configs/**/*.yaml"]` entry pointed at a path that does not
# exist and silently shipped nothing.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
  "slow: tests that build large models or run training steps",
  "gpu: tests that require CUDA",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
